apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    namespace "com.example.cowdunggame"

    defaultConfig {
        applicationId "com.example.cowdunggame"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 2
        versionName "2.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    // 敏感词过滤（与 shrimpfarm 同款）：自带中英文词库，支持拼音/同音字/中介字遮挡
    implementation 'com.github.houbb:sensitive-word:0.29.5'
    // Realtime WebSocket（Supabase Realtime 订阅）
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.google.code.gson:gson:2.14.0'
}